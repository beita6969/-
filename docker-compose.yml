version: '3.8'

services:
  plate-recognition:
    build: .
    container_name: plate_recognition_app
    restart: unless-stopped
    ports:
      - "5003:5003"
    volumes:
      - ./uploads:/app/uploads
      - ./results:/app/results
      - ./plate_records.db:/app/plate_records.db
      - ./detection_metrics.json:/app/detection_metrics.json
      - ./best.pt:/app/best.pt
      - ./yolov8x.pt:/app/yolov8x.pt
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    networks:
      - plate_network

  nginx:
    image: nginx:alpine
    container_name: plate_recognition_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - ./uploads:/app/uploads:ro
      - ./results:/app/results:ro
    depends_on:
      - plate-recognition
    networks:
      - plate_network

networks:
  plate_network:
    driver: bridge